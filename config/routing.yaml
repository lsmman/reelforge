# reelforge 장르 라우팅 표
#
# Kling 방식: 먼저 장르를 판별하고, 그 장르를 가장 잘 만드는 모델·프리셋을 고른다.
# 이 파일은 사람이 고치라고 있는 파일이다. 모델을 바꾸고 싶으면 여기만 고친다.
#
# 필드
#   label             한국어 표시명
#   match             AI 가 장르를 고를 때 참고하는 힌트
#   pinterest_suffix  검색어에 덧붙일 말. 레퍼런스 품질을 좌우한다
#   primary/fallback  backend + model + params
#   prompt_template   최종 프롬프트 뼈대. {} 자리를 AI 가 채운다
#   negative          피할 것
#   upscale           마무리 업스케일 (선택)

defaults:
  aspect: "3:2"
  ref_count: 10
  score_threshold: 80
  max_attempts: 3
  upscale: { backend: higgsfield, model: bytedance_image_upscale, params: { resolution: "4k" } }

genres:

  portrait:
    label: 인물 / 포트레이트
    match: 사람 얼굴·상반신이 주인공. 프로필, 패션, UGC, 에디토리얼
    pinterest_suffix: portrait photography lighting editorial
    primary:  { backend: higgsfield, model: soul_2,   params: { quality: "2k" } }
    fallback: { backend: gemini,     model: default }
    prompt_template: |
      {shot_type} portrait of {subject}, {styling}.
      Lighting: {lighting}. Lens: {lens}. Mood: {mood}.
      Skin texture natural and unretouched, sharp focus on eyes.
      Color palette: {palette}. Background: {background}.
    negative: plastic skin, over-smoothed face, extra fingers, warped hands, uncanny eyes, heavy HDR

  cinematic_still:
    label: 시네마틱 스틸
    match: 영화 한 장면 같은 컷. 드라마틱한 조명과 색보정이 핵심
    pinterest_suffix: cinematic film still color grading
    primary:  { backend: higgsfield, model: cinematic_studio_2_5, params: { resolution: "2k" } }
    fallback: { backend: gemini,     model: default }
    prompt_template: |
      Cinematic film still, {scene}. {subject} {action}.
      Anamorphic {lens}, {lighting}, {time_of_day}.
      Color grade: {palette}. Film grain, shallow depth of field.
      Framing: {composition}.
    negative: flat lighting, video game render, oversaturated, watermark, text overlay

  product:
    label: 제품 / 커머스
    match: 물건이 주인공. 광고 컷, 패키지샷, 커머스 썸네일
    pinterest_suffix: product photography studio commercial
    primary:  { backend: higgsfield, model: marketing_studio_image, params: { resolution: "2k" } }
    fallback: { backend: gemini,     model: default }
    prompt_template: |
      Commercial product photograph of {subject} on {surface}.
      {lighting} studio lighting, {background} background.
      Crisp edges, accurate material rendering ({material}).
      Composition: {composition}. Palette: {palette}.
    negative: distorted logo, unreadable label text, floating shadow, dirty surface, cluttered background

  food:
    label: 음식
    match: 요리, 음료, 베이커리, 식탁 스타일링
    pinterest_suffix: food photography styling overhead
    primary:  { backend: higgsfield, model: kling_omni_image, params: { resolution: "2k" } }
    fallback: { backend: gemini,     model: default }
    prompt_template: |
      Food photograph of {subject}, {plating}.
      {angle} angle, {lighting}, shallow depth of field.
      Fresh textures, visible steam/moisture where natural.
      Props: {props}. Palette: {palette}.
    negative: plastic-looking food, wrong utensils, melted mess, artificial gloss, dull colors

  landscape:
    label: 풍경 / 자연
    match: 자연 경관, 하늘, 바다, 산, 도시 스카이라인
    pinterest_suffix: landscape photography golden hour
    primary:  { backend: higgsfield, model: soul_location, params: {} }
    fallback: { backend: gemini,     model: default }
    prompt_template: |
      Wide landscape photograph of {location} during {time_of_day}.
      {weather}, {lighting}. Foreground: {foreground}.
      Atmospheric depth, natural color. Palette: {palette}.
    negative: fake HDR halo, oversaturated sky, tilted horizon, watermark

  architecture:
    label: 건축 / 인테리어
    match: 건물 외관, 실내 공간, 카페·매장 인테리어
    pinterest_suffix: interior architecture photography
    primary:  { backend: higgsfield, model: nano_banana_pro, params: { resolution: "2k" } }
    fallback: { backend: gemini,     model: default }
    prompt_template: |
      Architectural photograph of {space}. {style} style.
      Materials: {material}. Lighting: {lighting}.
      Straight vertical lines, {lens} perspective.
      Palette: {palette}. Composition: {composition}.
    negative: warped verticals, impossible geometry, fisheye distortion, clutter, blown highlights

  anime_illustration:
    label: 애니 / 일러스트
    match: 2D 애니메이션풍, 만화, 디지털 페인팅
    pinterest_suffix: anime illustration concept art
    primary:  { backend: higgsfield, model: seedream_v4_5, params: { quality: basic } }
    fallback: { backend: gemini,     model: default }
    prompt_template: |
      {style} illustration of {subject}, {action}.
      Line quality: {line}. Shading: {shading}.
      Palette: {palette}. Background: {background}. Mood: {mood}.
    negative: photorealistic face, 3d render, muddy colors, broken anatomy, extra limbs

  concept_art:
    label: 컨셉 아트 / 3D
    match: 게임·영화 컨셉, 크리처, 메카, 3D 렌더 느낌
    pinterest_suffix: concept art environment design
    primary:  { backend: higgsfield, model: soul_cinematic, params: { quality: "2k" } }
    fallback: { backend: gemini,     model: default }
    prompt_template: |
      Concept art of {subject}. {style}, {medium}.
      Scale reference: {scale}. Lighting: {lighting}.
      Detail density high on {focus}, loose elsewhere. Palette: {palette}.
    negative: flat lighting, stock photo look, unreadable silhouette, symmetrical mush

  typography_poster:
    label: 타이포 / 포스터
    match: 글자가 주인공. 포스터, 배너, 앨범 커버, 썸네일
    pinterest_suffix: graphic design poster typography
    primary:  { backend: higgsfield, model: openai_hazel, params: { quality: high } }
    fallback: { backend: gemini,     model: default }
    prompt_template: |
      Graphic design poster. Headline text reads exactly "{headline}".
      Typeface feel: {type_style}. Layout: {layout}.
      Palette: {palette}. Graphic elements: {elements}.
      Text must be spelled correctly and fully legible.
    negative: misspelled text, garbled letters, cropped words, cluttered hierarchy

  logo_icon:
    label: 로고 / 아이콘
    match: 심볼, 앱 아이콘, 브랜드 마크, 벡터풍 그래픽
    pinterest_suffix: logo design minimal mark
    primary:  { backend: higgsfield, model: recraft_v4_1, params: { model_type: vector, resolution: "1k" } }
    fallback: { backend: gemini,     model: default }
    prompt_template: |
      Minimal {kind} mark for {subject}. {style} style.
      Geometry: {geometry}. Flat solid colors: {palette}.
      Centered on plain {background} background, generous margin.
    negative: gradient mesh, photographic texture, tiny illegible detail, drop shadow, mockup context

  diagram:
    label: 다이어그램 / 인포그래픽
    match: 구조도, 흐름도, 설명 그림, 차트가 들어간 이미지
    pinterest_suffix: infographic diagram design
    primary:  { backend: higgsfield, model: nano_banana_pro, params: { resolution: "2k" } }
    fallback: { backend: gemini,     model: default }
    prompt_template: |
      Clean infographic diagram explaining {topic}.
      Elements: {elements}. Flow direction: {flow}.
      All labels spelled correctly: {labels}.
      Palette: {palette}. Plenty of whitespace, consistent stroke weight.
    negative: gibberish text, overlapping labels, rainbow colors, 3d bevel, drop shadow

  general:
    label: 일반 (분류 실패 폴백)
    match: 위 어디에도 확실히 안 들어맞을 때
    pinterest_suffix: photography
    primary:  { backend: higgsfield, model: nano_banana_pro, params: { resolution: "2k" } }
    fallback: { backend: gemini,     model: default }
    prompt_template: |
      {subject}, {style}. Lighting: {lighting}. Mood: {mood}.
      Composition: {composition}. Palette: {palette}.
    negative: watermark, text overlay, low resolution, jpeg artifacts

# ---------------------------------------------------------------------------
# 영상 라우팅
#
# 이미지와 같은 발상 — 장르마다 어울리는 카메라 무브가 다르다. 인물 컷을
# 휘두르면 안 되고 컨셉 아트를 가만히 두면 심심하다. 여기 있는 한 줄이
# 그 장르의 기본 무브가 된다. `rf.py video` 가 최종 이미지에 이걸 붙여
# image-to-video 로 넘긴다.
#
# Veo 는 16:9 와 9:16 만 받는다. 원본 이미지가 가로면 16:9, 세로면 9:16 으로
# 자동 매핑된다.
video:
  defaults:
    backend: gemini
    model: veo-3.1-generate-preview
    cheap_model: veo-3.1-fast-generate-preview
    duration: 8
    resolution: 720p
    generate_audio: false
  motion:
    portrait: 아주 느린 푸시인. 인물은 정지해 있고 머리카락과 옷자락, 커튼만 미세하게 흔들린다
    cinematic_still: 느린 좌우 트래킹 또는 완만한 푸시인. 대기 중의 비·먼지·연기가 흐르고 반사광이 일렁인다
    product: 제품을 축으로 한 아주 느린 오빗. 제품 자체는 움직이지 않고 하이라이트만 표면을 타고 이동한다
    food: 미세한 푸시인과 함께 김이 피어오르고 소스나 국물 표면이 아주 약하게 흔들린다
    landscape: 고정 또는 아주 느린 크레인 업. 구름과 안개가 흐르고 물결이 반짝인다
    architecture: 느리고 곧은 돌리인. 수직선을 유지하며 빛의 각도만 서서히 변한다
    anime_illustration: 배경 레이어를 느리게 패닝하는 2D 팔로우. 인물은 눈 깜빡임과 옷자락만 움직인다
    concept_art: 아주 느린 푸시인과 함께 안개층이 흘러 스케일을 드러낸다
    typography_poster: 움직이지 않는다. 종이 질감 위 미세한 그레인 흔들림만
    logo_icon: 움직이지 않는다. 획이 그려지는 듯한 미세한 리빌만
    diagram: 움직이지 않는다. 화살표를 따라가는 미세한 강조만
    general: 아주 느린 푸시인. 광원과 그림자만 서서히 이동한다
